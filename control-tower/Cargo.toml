[package]
name = "control-tower"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
google-cloud-auth = { version = "1.17", default-features = false, features = ["default-rustls-provider"] }
google-cloud-compute-v1 = { version = "4.0", default-features = false, features = ["default-rustls-provider", "instances", "zone-operations"] }
google-cloud-gax = "1.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-tungstenite = "0.30"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
